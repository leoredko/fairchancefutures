{% extends "base.html" %}
{% block title %}Staff sign in{% endblock %}
{% block body %}
<div class="desk" style="padding-top:64px; max-width:420px">
  <h1>Bridge</h1>
  <p class="lede" style="margin:10px 0 20px">Counselor sign in.</p>

  {% if error %}<div class="denied" style="margin-bottom:16px">
    <span class="what">{{ error }}</span></div>{% endif %}

  <form method="post" action="/staff-signin" autocomplete="off" class="stack">
    <label class="small" for="staff_id">Staff ID</label>
    <input class="choice" id="staff_id" name="staff_id" autocapitalize="characters"
           autocomplete="username" autofocus value="{{ staff_id or '' }}">
    <button class="btn wide" type="submit">Next</button>
  </form>
</div>
{% endblock %}
