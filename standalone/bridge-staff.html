<style>
/* Bridge.

   Teal for the things that move you forward, amber for the things that need a
   person. Warm white underneath rather than the beige-grey of every
   institutional form anybody in this situation has ever been handed.

   No web fonts and no CDN. The tablet surface is metered by the minute, so
   the app makes zero outbound requests to render. */

:root {
  /* text */
  --ink: #12232E;
  --ink-2: #3D5361;
  --muted: #64808F;
  --faint: #93A8B4;

  /* surfaces */
  --page: #FFFFFF;
  --surface: #F4F9F8;
  --surface-2: #E9F3F1;
  --line: #DCE9E6;
  --line-strong: #C3D8D3;
  --track: #DFEDEA;

  /* brand */
  --teal: #0E7C6B;
  --teal-deep: #0A5C50;
  --teal-soft: #E3F3F0;
  --amber: #E08A1E;
  --amber-soft: #FDF3E3;
  --sky: #1B74B8;
  --sky-soft: #E8F2FA;
  --green: #17855B;
  --green-soft: #E5F4EC;
  --rose: #C4344B;
  --rose-soft: #FCEDEF;

  --display: "Space Grotesk", "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;

  --r: 12px;
  --r-lg: 18px;
  --r-pill: 999px;

  --lift: 0 1px 2px rgba(18, 35, 46, .05), 0 1px 3px rgba(18, 35, 46, .04);
  --lift-2: 0 4px 16px rgba(14, 124, 107, .10), 0 1px 3px rgba(18, 35, 46, .05);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--surface);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--teal); text-underline-offset: 2px; }
a:hover { color: var(--teal-deep); }

:focus-visible {
  outline: 2.5px solid var(--teal);
  outline-offset: 2px;
  border-radius: 6px;
}

/* ---- shells ------------------------------------------------------------ */

.tablet { width: min(780px, 100%); min-height: 100vh; margin: 0 auto;
          background: var(--page); display: flex; flex-direction: column;
          box-shadow: var(--lift-2); }
.phone  { width: min(440px, 100%); min-height: 100vh; margin: 0 auto;
          background: var(--page); display: flex; flex-direction: column;
          box-shadow: var(--lift-2); }
.desk   { max-width: 1160px; margin: 0 auto; padding: 0 24px 80px; }
.sheet  { max-width: 1160px; margin: 0 auto; padding: 0 20px 72px; }

.bar {
  padding: 15px 28px;
  background: linear-gradient(103deg, var(--teal-deep) 0%, var(--teal) 62%, #12907C 100%);
  color: #EAF6F4;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 20;
}
.bar .wordmark {
  font-family: var(--display); font-weight: 700; font-size: 19px;
  letter-spacing: -.015em; color: #FFFFFF;
}
.bar .who { font-size: 14px; color: #BEDFD9; }
.bar .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.bar a { color: #EAF6F4; }
.bar a:hover { color: #FFFFFF; }
.bar .pill {
  font-size: 13px; border: 1px solid rgba(255,255,255,.34);
  border-radius: var(--r-pill); padding: 5px 13px; text-decoration: none;
  white-space: nowrap; color: #EAF6F4;
}
.bar .pill:hover { background: rgba(255,255,255,.14); }
.bar .tag { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.3);
            color: #FFFFFF; }

.pane { flex-grow: 1; padding: 32px 32px 40px; display: flex;
        flex-direction: column; gap: 22px; min-height: 0; }
.phone .pane { padding: 22px 20px 32px; gap: 18px; }

/* ---- type -------------------------------------------------------------- */

h1 { font-family: var(--display); font-weight: 700; font-size: 33px;
     line-height: 1.16; letter-spacing: -.02em; }
.phone h1 { font-size: 26px; }
h2 { font-family: var(--display); font-weight: 700; font-size: 20px;
     line-height: 1.25; letter-spacing: -.012em; }
h3 { font-family: var(--display); font-weight: 600; font-size: 15px;
     letter-spacing: -.005em; color: var(--ink); }

.lede  { font-size: 17.5px; line-height: 1.5; color: var(--ink-2); }
.small { font-size: 14.5px; color: var(--ink-2); }
.tiny  { font-size: 13px; line-height: 1.5; color: var(--muted); }
.strong { font-weight: 600; color: var(--ink); }

/* ---- progress ---------------------------------------------------------- */

.progress { display: flex; align-items: center; gap: 14px; }
.track { flex-grow: 1; height: 8px; border-radius: var(--r-pill);
         background: var(--track); overflow: hidden; }
.track > span {
  display: block; height: 100%; border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--teal) 0%, #24A88F 100%);
  transition: width .3s cubic-bezier(.4,0,.2,1);
}

/* ---- choices, buttons -------------------------------------------------- */

.choices { display: flex; flex-direction: column; gap: 12px; }

.choice {
  display: block; width: 100%; text-align: left;
  background: var(--page);
  border: 2px solid var(--line-strong);
  border-radius: var(--r-lg);
  padding: 20px; font: inherit; font-size: 19px; font-weight: 600;
  color: inherit; text-decoration: none; cursor: pointer;
  transition: border-color .14s ease, background .14s ease, transform .1s ease;
}
.choice:hover { border-color: var(--teal); background: var(--teal-soft); }
.choice:active { transform: scale(.995); }
.choice.selected { border-color: var(--teal); background: var(--teal-soft); }
.choice .note { display: block; font-size: 14.5px; font-weight: 400;
                color: var(--muted); margin-top: 6px; line-height: 1.45; }
input.choice { font-weight: 500; }
input.choice::placeholder { color: var(--faint); font-weight: 400; }

.btn {
  display: inline-block;
  background: linear-gradient(180deg, #13907D 0%, var(--teal) 100%);
  color: #FFFFFF;
  border: 0; border-radius: var(--r);
  padding: 14px 22px; font: inherit; font-weight: 600; font-size: 15.5px;
  cursor: pointer; text-decoration: none; text-align: center;
  box-shadow: 0 1px 2px rgba(10, 92, 80, .28);
  transition: filter .14s ease, transform .1s ease;
}
.btn:hover { filter: brightness(1.07); color: #FFFFFF; }
.btn:active { transform: translateY(1px); }
.btn.wide { width: 100%; padding: 17px 22px; font-size: 17px; }
.btn.ghost { background: var(--page); color: var(--teal-deep);
             border: 1.5px solid var(--line-strong); box-shadow: none; }
.btn.ghost:hover { background: var(--teal-soft); border-color: var(--teal);
                   color: var(--teal-deep); filter: none; }
.btn.quiet { background: none; color: var(--muted); border: 0; box-shadow: none;
             padding: 8px 0; text-decoration: underline; font-weight: 500; }
.btn.quiet:hover { color: var(--ink); filter: none; }
.btn.amber { background: linear-gradient(180deg, #EE9A2C 0%, var(--amber) 100%);
             box-shadow: 0 1px 2px rgba(180, 108, 18, .28); }

/* ---- cards ------------------------------------------------------------- */

.card {
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 19px 21px;
  background: var(--page);
  box-shadow: var(--lift);
  display: flex; flex-direction: column; gap: 10px;
}
.card.soft { background: var(--surface); box-shadow: none; }
.card.accent { border-left: 4px solid var(--teal); }
.card.warn { border: 1px solid #F0D5AC; background: var(--amber-soft);
             box-shadow: none; }
.card.good { border: 1px solid #B6DEC8; background: var(--green-soft);
             box-shadow: none; }
.card > .tag, .stack > .tag { align-self: flex-start; }

.grid { display: grid; gap: 18px; }
.grid.two { grid-template-columns: 1fr 1fr; }
.grid.three { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 900px) { .grid.two, .grid.three { grid-template-columns: 1fr; } }

.stack { display: flex; flex-direction: column; gap: 15px; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spacer { margin-top: auto; }

/* ---- hero -------------------------------------------------------------- */

.hero {
  background: linear-gradient(135deg, var(--teal-deep) 0%, var(--teal) 55%, #1AA18A 100%);
  color: #FFFFFF; padding: 46px 32px 40px; border-radius: 0 0 28px 28px;
  margin-bottom: 28px;
}
.hero h1 { color: #FFFFFF; font-size: 38px; }
.hero .lede { color: #CDE9E4; margin-top: 10px; font-size: 18px; }
.phone .hero, .tablet .hero { border-radius: 0; margin-bottom: 0; }

/* ---- timeline ---------------------------------------------------------- */

.timeline { display: flex; flex-direction: column; }
.event { display: flex; gap: 15px; padding: 15px 0;
         border-bottom: 1px solid var(--track); }
.event:last-child { border-bottom: 0; }
.dot {
  flex: 0 0 26px; height: 26px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; margin-top: 2px;
  background: var(--green); color: #FFFFFF;
}
.event.pending .dot { background: var(--page); color: var(--amber);
                      border: 2px solid var(--amber); }

/* ---- table ------------------------------------------------------------- */

.queue {
  width: 100%; border-collapse: separate; border-spacing: 0;
  background: var(--page); border: 1px solid var(--line);
  border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--lift);
}
.queue th {
  text-align: left; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--teal-deep); padding: 12px 18px;
  border-bottom: 1px solid var(--line); background: var(--teal-soft);
  font-weight: 700;
}
.queue td { padding: 16px 18px; border-bottom: 1px solid var(--track);
            vertical-align: top; }
.queue tr:last-child td { border-bottom: 0; }
.queue tbody tr:hover { background: var(--surface); }
.queue tr.overdue td:first-child { box-shadow: inset 4px 0 0 var(--rose); }

/* ---- tags -------------------------------------------------------------- */

.tag {
  display: inline-block; font-size: 12.5px; font-weight: 600;
  border: 1px solid var(--line-strong); border-radius: var(--r-pill);
  padding: 3px 12px; color: var(--muted); white-space: nowrap;
  background: var(--page);
}
.tag.teal  { border-color: #A6D5CD; color: var(--teal-deep); background: var(--teal-soft); }
.tag.amber { border-color: #EFCE9C; color: #9A5F12;         background: var(--amber-soft); }
.tag.sky   { border-color: #AFCFE8; color: var(--sky);      background: var(--sky-soft); }
.tag.green { border-color: #ADD8C0; color: var(--green);    background: var(--green-soft); }
.tag.rose  { border-color: #EDB6BF; color: var(--rose);     background: var(--rose-soft); }
/* the old names, kept so nothing silently loses its colour */
.tag.rust { border-color: #EFCE9C; color: #9A5F12; background: var(--amber-soft); }
.tag.blue { border-color: #AFCFE8; color: var(--sky); background: var(--sky-soft); }

/* ---- ladder ------------------------------------------------------------ */

.rung { display: flex; gap: 14px; padding: 14px 16px;
        border: 1px solid var(--line); border-radius: var(--r);
        background: var(--page); }
.rung.active { border-color: var(--teal); border-width: 2px;
               background: var(--teal-soft); }
.rung .n { font-family: var(--display); font-weight: 700; color: var(--faint);
           flex: 0 0 20px; font-size: 15px; }
.rung.active .n { color: var(--teal); }

/* ---- letter ------------------------------------------------------------ */

.letter {
  font-family: var(--mono); font-size: 12.5px; line-height: 1.68;
  white-space: pre-wrap; background: var(--page);
  border: 1px solid var(--line); border-radius: var(--r);
  padding: 24px; color: var(--ink-2);
}
textarea.letter { width: 100%; min-height: 420px; resize: vertical; }
@media (max-width: 560px) { .letter { font-size: 10.5px; line-height: 1.5; } }

/* ---- denial ------------------------------------------------------------ */

.denied {
  border: 1px solid #EDB6BF; border-left: 4px solid var(--rose);
  border-radius: var(--r); padding: 16px 19px;
  background: var(--rose-soft); display: flex; flex-direction: column; gap: 8px;
}
.denied .what { font-weight: 600; color: var(--rose); }

/* ---- forms ------------------------------------------------------------- */

fieldset { border: 0; display: flex; flex-direction: column; gap: 12px; }
legend { padding: 0; }
label.check {
  display: flex; gap: 12px; align-items: flex-start;
  border: 1.5px solid var(--line-strong); border-radius: var(--r);
  padding: 13px 15px; cursor: pointer; background: var(--page);
  transition: border-color .14s ease, background .14s ease;
}
label.check:hover { border-color: var(--teal); background: var(--teal-soft); }
input[type="radio"], input[type="checkbox"] {
  width: 19px; height: 19px; accent-color: var(--teal); flex: none;
  margin-top: 1px;
}

.field { display: flex; flex-direction: column; gap: 7px; }
.field > label { font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 12.5px; color: var(--muted); }
.field input, .field select {
  font: inherit; font-size: 16px; padding: 13px 15px;
  border: 1.5px solid var(--line-strong); border-radius: var(--r);
  background: var(--page); color: var(--ink); width: 100%;
}
.field input:focus, .field select:focus { border-color: var(--teal); }
.field.bad input, .field.bad select { border-color: var(--rose);
                                      background: var(--rose-soft); }
.field .mono { font-family: var(--mono); letter-spacing: .06em; }

.compact fieldset { gap: 6px; margin-bottom: 6px; }
.compact label.check { padding: 8px 12px; }
.compact input[type="radio"], .compact input[type="checkbox"] {
  width: 16px; height: 16px;
}
.compact legend { margin-top: 12px; }

/* ---- the small print --------------------------------------------------- */

.colophon { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); }
.colophon p { font-size: 12px; color: var(--faint); line-height: 1.5; }

@media print {
  .bar, .btn, .hero, .colophon { display: none !important; }
  .letter { border: 0; padding: 0; font-size: 11pt; }
  body { background: #fff; }
}


/* This build has no server, so the shell fills the window itself. */
html, body { min-height: 100%; }
#app { min-height: 100vh; }
.hero { border-radius: 0; margin-bottom: 0; padding: 40px 32px 34px; }
.phone .hero { padding: 30px 22px 26px; }
.phone .hero h1 { font-size: 28px; }

function blank() {
  return { accounts: {}, clients: seedClients(), drafts: {},
           review: { reviewed: 0, edited: 0 } };

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* private window, blocked storage: fall through */ }
  return blank();
}

function save() {
  try {
    DB.savedAt = new Date().toISOString();
    localStorage.setItem(KEY, JSON.stringify(DB));
  } catch (e) { /* nothing to do; the session still works until reload */ }
}

function lastSavedText() {
  if (!DB.savedAt) return "not yet";
  const d = new Date(DB.savedAt);
  return d.toLocaleString(undefined,
    { dateStyle: "medium", timeStyle: "short" });
}

function reset() {
  DB = blank();
  save();
  location.hash = "#/";
  render();
}

/* ---------- identifiers ---------------------------------------------- */
/* Mirrors app/identifiers.py. DIN shape is confirmed from DOCCS; the NYSID
   check letter is not, so it is accepted and never validated. */

const DIN_RE = /^(\d{2})([A-Z])(\d{4})$/;
const NYSID_RE = /^(\d{8})([A-Z]?)$/;

function scrub(raw) { return (raw || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase(); }

function parseId(raw) {
  const s = scrub(raw);
  if (!s) throw new Error("Enter your DIN or your NYSID.");
  let m = DIN_RE.exec(s);
  if (m) return { kind: "DIN", key: s, display: m[1] + "-" + m[2] + "-" + m[3] };
  if (NYSID_RE.test(s)) return { kind: "NYSID", key: s, display: s };
  if (/^\d{6}$/.test(s))
    throw new Error("That looks like a DIN with the facility letter missing. " +
      "A DIN is two digits, a letter, then four digits, like 98-A-0004.");
  if (s.length < 7)
    throw new Error("That is too short. A DIN looks like 98-A-0004. A NYSID is " +
      "eight digits, sometimes with a letter on the end.");
  throw new Error("That is not a DIN or a NYSID. A DIN is two digits, a letter, " +
    "then four digits, like 98-A-0004. A NYSID is eight digits, sometimes with " +
    "a letter on the end.");
}

/* ---------- PINs ------------------------------------------------------ */
/* Hashed with PBKDF2 through WebCrypto. Even in a demo that stores everything
   in the browser, writing somebody's PIN down in the clear teaches the wrong
   habit to whoever picks this up next. */

const ROUNDS = 150000;

async function hashPin(pin, saltHex) {
  const salt = saltHex ? hexToBytes(saltHex)
                       : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt, iterations: ROUNDS, hash: "SHA-256" }, key, 256);
  return bytesToHex(salt) + "$" + bytesToHex(new Uint8Array(bits));
}

async function checkPin(pin, stored) {
  if (!stored) return false;
  const saltHex = stored.split("$")[0];
  return (await hashPin(pin, saltHex)) === stored;
}

function bytesToHex(b) {
  return Array.from(b).map((x) => x.toString(16).padStart(2, "0")).join("");
}
function hexToBytes(h) {
  const out = new Uint8Array(h.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(h.substr(i * 2, 2), 16);
  return out;
}

const MAX_ATTEMPTS = 5;
const LOCKOUT_MS = 15 * 60 * 1000;
const IDLE_MS = 15 * 60 * 1000;
const STAFF_IDLE_MS = 8 * 60 * 60 * 1000;

function pinProblem(pin, idNumber) {
  const digits = (pin || "").replace(/\D/g, "");
  if (digits.length !== 6) return "Your PIN needs to be 6 numbers.";
  if (new Set(digits).size === 1)
    return "Pick something other than the same number six times.";
  let up = true, down = true;
  for (let i = 1; i < digits.length; i++) {
    if (+digits[i] !== +digits[i - 1] + 1) up = false;
    if (+digits[i] !== +digits[i - 1] - 1) down = false;
  }
  if (up || down) return "Pick something that is not just counting up or down.";
  if (idNumber && (idNumber.replace(/\D/g, "")).includes(digits))
    return "That is part of your own number, which anyone holding your " +
           "paperwork can read. Pick something else.";
  return null;
}

/* ---------- accounts and session -------------------------------------- */

function accountFor(role, key) {
  const id = role + ":" + key;
  if (!DB.accounts[id]) return null;
  return Object.assign({ id }, DB.accounts[id]);
}

function accountsForClient(clientId) {
  return Object.keys(DB.accounts).filter(
    (k) => DB.accounts[k].role === "inside" && DB.accounts[k].subject === clientId);
}

function ensureAccounts() {
  Object.values(DB.clients).forEach((c) => {
    [["inside", c.din], ["inside", c.nysid], ["family", c.helperCode]]
      .forEach(([role, key]) => {
        const id = role + ":" + key;
        if (!DB.accounts[id])
          DB.accounts[id] = { role, subject: c.id, key,
                              pin: null, fails: 0, lockedUntil: null };
      });
  });
  if (!DB.accounts["staff:REYES"])
    DB.accounts["staff:REYES"] = { role: "staff", subject: "", key: "REYES",
                                   pin: null, fails: 0, lockedUntil: null };
  save();
}

function startSession(account) {
  writeSession({ account: account.id, role: account.role,
                 subject: account.subject, seen: Date.now() });
}

function readSession() {
  try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); }
  catch (e) { return null; }
}

function writeSession(value) {
  try {
    if (value) localStorage.setItem(SESSION_KEY, JSON.stringify(value));
    else localStorage.removeItem(SESSION_KEY);
  } catch (e) { /* private window: the app still works for this page load */ }
}

function session() {
  const s = readSession();
  if (!s) return null;
  const limit = s.role === "staff" ? STAFF_IDLE_MS : IDLE_MS;
  if (Date.now() - s.seen > limit) { writeSession(null); return null; }
  s.seen = Date.now();
  writeSession(s);
  return s;
}

function signOut() {
  writeSession(null);
  // go() only redraws when the hash actually changes, and signing out from the
  // sign-in screen leaves it unchanged. Force the redraw so the session is
  // visibly gone either way.
  if (location.hash === DOOR[APP]) render(); else go(DOOR[APP]);
}

function subject() {
  const s = session();
  return s && s.subject ? DB.clients[s.subject] : null;
}

/* ---------- triage, mirroring app/triage.py --------------------------- */

function classify(a) {
  const reasons = [];
  let review = false;

  const obligationNotes = [];
  (a.obligations || []).forEach((o) => {
    if (o === "restitution") obligationNotes.push(
      "Restitution goes to the obligations list, not the credit path. " +
      "Different mechanism, different screen. Whether restitution is ever " +
      "furnished to a bureau is still an open question, so the app does not " +
      "claim either way.");
    if (o === "child_support") obligationNotes.push(
      "Child support arrears do reach credit reports: states are required to " +
      "report delinquencies to the bureaus periodically, after notice and a " +
      "chance to contest. Expect this one on the file. (42 U.S.C. 666(a)(7).)");
    if (o === "court_fines") obligationNotes.push(
      "Court fines are tracked as an obligation. Civil judgments largely " +
      "vanished from credit reports after July 2017, so do not assume a fine " +
      "is on the file, but whether fines are furnished at all is still open.");
  });

  const done = (key) => ({
    state: key, reasons, review, obligations: obligationNotes,
    jumps: key === "errors_present",
    path: RULES.states.find((s) => s.key === key)
  });

  if (a.report_result === "not_pulled") {
    reasons.push("No report on file yet, so there is nothing to classify.");
    if (a.ever_had_account === "unsure")
      reasons.push("Client is unsure whether they ever had an account. Common, " +
        "and not a problem. The report settles it.");
    return done("not_yet_triaged");
  }

  // Errors outrank everything: only a dispute carries a legal clock.
  if (a.recognizes_everything === "some_not_mine") {
    reasons.push("Client does not recognize at least one item on the report.");
    if (a.collections === "some" || a.collections === "many")
      reasons.push("Collections are also present. Dispute first, because it is " +
        "the only part with a deadline; debt triage follows.");
    return done("errors_present");
  }

  if (a.report_result === "no_file_found") {
    reasons.push("Bureau returned no file. Empty, not damaged.");
    if (a.ever_had_account === "yes") {
      reasons.push("Client recalls an account but the bureau found no file. " +
        "Worth a second look: a name or SSN mismatch can hide a real file.");
      review = true;
    }
    if (a.has_bank_account === "no")
      reasons.push("No bank account, so the builder loan or secured card needs " +
        "one opened first. That is the first step, not a blocker.");
    return done("credit_invisible");
  }

  if (a.collections === "some" || a.collections === "many") {
    reasons.push("Collections present on the report. Real debt, not a gap.");
    if (a.collections === "many")
      reasons.push("Volume is high enough that debt triage comes first.");
    return done("damaged_file");
  }

  if (a.collections === "unknown") {
    reasons.push("Collections status unknown on a file that exists. Counselor " +
      "reads the report before the path is set.");
    review = true;
  }
  if (a.recognizes_everything === "not_reviewed_yet") {
    reasons.push("Nobody has walked the report with the client line by line " +
      "yet, so an error finding is still possible.");
    review = true;
  }
  reasons.push(a.report_result === "thin_or_stale"
    ? "File exists but is thin or stale. Boosters before new credit."
    : "Full file, nothing in collections, nothing disputed. Boosters and " +
      "on-time signals are the remaining work.");
  return done("thin_file");
}

/* ---------- letters --------------------------------------------------- */

function today() {
  return new Date().toLocaleDateString("en-US",
    { year: "numeric", month: "long", day: "numeric" });
}

function disputeLetters(client, item) {
  return RULES.bureaus.map((b) => ({
    id: client.id + "-" + b.name + "-" + item.last4,
    bureau: b.name,
    approved: null,
    edited: null,
    citations: RULES.facts.filter((f) => /1681i|dispute/i.test(f.source + f.statement))
                 .map((f) => f.statement + " (" + f.source + ", checked " + f.checked + ")")
                 .concat(["Address from " + b.url], b.note ? [b.note] : []),
    body: RULES.disputeTemplate
      .replace("{today}", today())
      .replace("{address_block}", b.address.join("\n"))
      .replace(/\{client_name\}/g, client.name)
      .replace("{creditor}", item.creditor)
      .replace("{last_four}", item.last4)
      .replace("{reason}", item.reason)
  }));
}

function requestLetter(client) {
  const helper = client.authorization ? client.authorization.helper : "the program";
  return RULES.requestTemplate
    .replace("{today}", today())
    .replace("{address_block}", RULES.acr.address.join("\n"))
    .replace(/\{client_name\}/g, client.name)
    .replace(/\{identification\}/g, client.din)
    .replace("{id_label}", "DIN")
    .replace(/\{facility\}/g, client.facility)
    .replace("{current_address}", "  c/o " + helper + ", on file with the program");
}

/* ---------- tiny view layer ------------------------------------------- */

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

function go(hash) { location.hash = hash; }

const ROUTES = [];
function route(pattern, view) { ROUTES.push({ pattern, view }); }

function render() {
  // Three apps, one caseload. Each is a separate document, so a write from the
  // coordinator's tab is invisible to the tablet's tab until the state is read
  // back. Re-read before drawing; the whole caseload is a few kilobytes.
  DB = load();
  ensureAccounts();
  const hash = location.hash.replace(/^#/, "") || "/";
  for (const r of ROUTES) {
    const m = r.pattern.exec(hash);
    if (m) {
      Promise.resolve(r.view.apply(null, m.slice(1))).then((html) => {
        document.getElementById("app").innerHTML = demoBar() + html;
        window.scrollTo(0, 0);
      });
      return;
    }
  }
  document.getElementById("app").innerHTML = demoBar() + notFound();
}

window.addEventListener("hashchange", render);

// And redraw immediately when another of the three apps writes, so a screen
// left open does not sit there showing something that is no longer true.
window.addEventListener("storage", function (e) {
  if (!e.key || e.key === KEY) render();   // the caseload, not the session
});

function demoBar() {
  return "";
}

/* ---------- screens: signing in --------------------------------------- */

let PENDING = null;   // { role, key, display, account }

route(/^\/signin$/, () => idScreen({
  shell: "tablet", title: "Your number",
  lede: "Your DIN or your NYSID. Either one works.",
  placeholder: "98-A-0004", role: "inside",
  help: '<div class="card soft"><span class="strong">Dashes and spaces don\'t matter.</span>' +
    '<span class="small">A DIN is two numbers, a letter, then four numbers. A ' +
    'NYSID is eight numbers, sometimes with a letter on the end.</span></div>' +
    ''
}));

route(/^\/helper$/, () => idScreen({
  shell: "phone", title: "Your code",
  lede: "It's printed on the letter that came in the mail.",
  placeholder: "BRIDGE-0000", role: "family",
  help: '<div class="card warn"><span class="strong">We will never ask you for</span>' +
    '<span class="small">Your Social Security number. Your bank login. Your ' +
    'card. Money. Access to your own credit.</span>' +
    '<span class="small">If anything calling itself Bridge asks you for those, ' +
    'it isn\'t us.</span></div>'
}));

function idScreen(opts) {
  const err = PENDING && PENDING.error ? denied(PENDING.error) : "";
  if (PENDING) PENDING.error = null;
  const wrap = opts.shell === "desk"
    ? '<div class="sheet" style="padding-top:44px;max-width:470px">'
    : '<div class="' + opts.shell + '">' + hero() + '<div class="pane">';
  const close = opts.shell === "desk"
    ? colophon() + '</div>'
    : '</div>' + colophon() + '</div>';
  return wrap +
    '<h1>' + esc(opts.title) + '</h1>' +
    '<p class="lede">' + esc(opts.lede) + '</p>' + err +
    '<input class="choice" id="idfield" autocapitalize="characters" ' +
      'autocomplete="off" spellcheck="false" placeholder="' + esc(opts.placeholder) + '" ' +
      'style="font-family:ui-monospace,monospace;letter-spacing:.08em" ' +
      'onkeydown="if(event.key===\'Enter\')submitId(\'' + opts.role + '\')">' +
    '<button class="btn wide" onclick="submitId(\'' + opts.role + '\')">Next</button>' +
    opts.help + close;
}

function openCase(din, display) {
  const id = "din-" + din.toLowerCase();
  const release = new Date(Date.now() + 180 * 86400000).toISOString().slice(0, 10);
  let code;
  do { code = "BRIDGE-" + String(Math.floor(1000 + Math.random() * 9000)); }
  while (Object.values(DB.clients).some((c) => c.helperCode === code));
  DB.clients[id] = {
    id, name: display, first: "", din, nysid: "", facility: "",
    release, clock: 180, state: "not_yet_triaged",
    stateLabel: "Not yet triaged", needs: "Intake not finished",
    helper: null, helperCode: code, rung: 1, reportSummary: "", lastPulled: "",
    collections: 0, consent: ["report_sharing"],
    consentOn: new Date().toISOString().slice(0, 10), lesson: "", flagged: [],
    answers: {}, pages: [], taskDone: false, authorization: null, timeline: []
  };
  ensureAccounts();
  save();
}

window.submitId = function (role) {
  const raw = document.getElementById("idfield").value;
  let key, display;
  if (role === "inside") {
    try { const p = parseId(raw); key = p.key; display = p.display; }
    catch (e) { PENDING = { error: e.message }; return render(); }
  } else {
    key = scrub(raw).replace(/^BRIDGE/, "BRIDGE-");
    if (role === "family" && !/^BRIDGE-\d{4}$/.test(key)) key = (raw || "").trim().toUpperCase();
    display = key;
  }
  let account = accountFor(role, key);

  // 2028 has not happened, so a DIN starting 28 cannot belong to a real
  // person. That makes it the safe range for anyone trying the app: sign in
  // with one and a case opens on the spot.
  if (!account && role === "inside" && /^28/.test(key)) {
    openCase(key, display);
    account = accountFor(role, key);
  }

  if (!account) {
    PENDING = { error: role === "inside"
      ? "No record here for " + display + ". Check the number, or ask your counselor to add you."
      : role === "family"
        ? "That code is not one of ours. It is printed on the letter that came in the mail."
        : "No staff account with that ID." };
    return render();
  }
  PENDING = { role, key, display, account };
  go(account.pin ? "#/pin" : "#/enroll");
};

route(/^\/enroll$/, () => {
  if (!PENDING) return notFound();
  return '<div class="tablet"><div class="pane">' +
    '<h1>Pick a PIN</h1>' +
    '<p class="lede">6 numbers. You choose it, and nobody here can see it once ' +
      'you do, not even your counselor.</p>' +
    (PENDING.error ? denied(PENDING.error) : "") +
    '<label class="small" for="p1">Your new PIN</label>' +
    '<input class="choice" id="p1" type="password" inputmode="numeric" maxlength="6" ' +
      'style="letter-spacing:.5em;font-size:26px">' +
    '<label class="small" for="p2">Type it once more</label>' +
    '<input class="choice" id="p2" type="password" inputmode="numeric" maxlength="6" ' +
      'style="letter-spacing:.5em;font-size:26px" ' +
      'onkeydown="if(event.key===\'Enter\')doEnroll()">' +
    '<button class="btn wide" onclick="doEnroll()">Save my PIN</button>' +
    '<div class="card dashed"><span class="strong">This tablet is shared.</span>' +
      '<span class="small">Don\'t use your birthday or any part of your own ' +
      'number. Anyone holding your paperwork can read those.</span>' +
      '<span class="small">If you forget it, your counselor can clear it and you ' +
      'pick a new one. They never get to see or choose it.</span></div>' +
    '</div></div>';
});

window.doEnroll = async function () {
  const a = document.getElementById("p1").value;
  const b = document.getElementById("p2").value;
  if (a !== b) { PENDING.error = "Those two PINs are not the same. Try again."; return render(); }
  const problem = pinProblem(a, PENDING.key);
  if (problem) { PENDING.error = problem; return render(); }

  const hashed = await hashPin(a);
  // A client signs in with either number, so both of their accounts take the
  // same PIN. Otherwise enrolling with a DIN would ask them to enrol again
  // when they typed their NYSID.
  const ids = PENDING.role === "inside"
    ? accountsForClient(PENDING.account.subject) : [PENDING.account.id];
  ids.forEach((id) => {
    DB.accounts[id].pin = hashed;
    DB.accounts[id].fails = 0;
    DB.accounts[id].lockedUntil = null;
  });
  save();
  startSession(accountFor(PENDING.role, PENDING.key));
  const role = PENDING.role; PENDING = null;
  go("#/" + role);
};

route(/^\/pin$/, () => {
  if (!PENDING) return notFound();
  const err = PENDING.error ? denied(PENDING.error) : "";
  PENDING.error = null;
  return '<div class="tablet"><div class="pane">' +
    '<h1>Your PIN</h1>' +
    '<p class="lede">' + esc(PENDING.display) + '</p>' + err +
    '<input class="choice" id="pinfield" type="password" inputmode="numeric" maxlength="6" ' +
      'style="letter-spacing:.5em;font-size:26px" ' +
      'onkeydown="if(event.key===\'Enter\')doSignIn()">' +
    '<button class="btn wide" onclick="doSignIn()">Sign in</button>' +
    '<div class="notes"><p class="tiny">Forgot it? Your counselor can clear it, ' +
      'then you pick a new one here. Nobody can tell you what your old one was.</p>' +
      '<p class="tiny"><a href="#/signin">Use a different number</a></p></div>' +
    '</div></div>';
});

window.doSignIn = async function () {
  const pin = document.getElementById("pinfield").value;
  const acct = DB.accounts[PENDING.account.id];

  if (acct.lockedUntil && Date.now() < acct.lockedUntil) {
    const mins = Math.max(1, Math.ceil((acct.lockedUntil - Date.now()) / 60000));
    PENDING.error = "Too many wrong tries. Try again in about " + mins +
      " minutes, or ask your counselor to reset it.";
    return render();
  }

  if (await checkPin(pin, acct.pin)) {
    acct.fails = 0; acct.lockedUntil = null; save();
    startSession(Object.assign({ id: PENDING.account.id }, acct));
    const role = PENDING.role; PENDING = null;
    return go("#/" + role);
  }

  acct.fails = (acct.fails || 0) + 1;
  if (acct.fails >= MAX_ATTEMPTS) {
    acct.lockedUntil = Date.now() + LOCKOUT_MS;
    acct.fails = 0;
    PENDING.error = "That PIN was wrong too many times. The account is locked " +
      "for 15 minutes. Your counselor can reset it sooner.";
  } else {
    PENDING.error = "That PIN is not right. " + (MAX_ATTEMPTS - acct.fails) +
      " tries left before it locks.";
  }
  save();
  render();
};

function denied(msg) {
  return '<div class="denied"><span class="what">' + esc(msg) + '</span></div>';
}

/* ---------- screens: inside ------------------------------------------- */

function guard(role) {
  if (role === "staff") {
    // Single sign-on: nothing to check, nowhere to send them.
    return { role: "staff", subject: "", coordinator: VENDOR_COORDINATOR };
  }
  const s = session();
  if (!s || s.role !== role) { go(DOOR[APP]); return null; }
  return s;
}

function bar(who, extra) {
  return '<div class="bar"><span class="wordmark">Bridge</span>' +
    '<span class="who">' + esc(who) + '</span>' +
    '<div class="right">' + (extra || "") +
    (APP === "staff" ? "" :
      '<a class="pill" href="#" onclick="signOut();return false">Sign out</a>') +
    '</div></div>';
}

route(/^\/inside$/, () => {
  if (!guard("inside")) return "";
  const c = subject();
  const next = RULES.insideQuestions.find((q) => !(q.field in c.answers));
  return go(next ? "#/inside/intake/" + next.index : "#/inside/case"), "";
});

route(/^\/inside\/intake\/(\d+)$/, (n) => {
  if (!guard("inside")) return "";
  const c = subject();
  const q = RULES.insideQuestions.find((x) => x.index === +n);
  if (!q) return notFound();
  const total = RULES.insideQuestions.length;
  const picked = c.answers[q.field];

  let choices = "";
  if (q.multi) {
    choices = '<div class="choices">' + q.options.map((o) =>
      '<label class="check"><input type="checkbox" name="opt" value="' + esc(o.value) + '"' +
      ((picked || []).indexOf(o.value) >= 0 ? " checked" : "") + '>' +
      '<span class="small">' + esc(o.label) + '</span></label>').join("") +
      '</div><button class="btn wide" onclick="answerMulti(' + n + ',\'' + q.field + '\')">Next</button>';
  } else {
    choices = '<div class="choices">' + q.options.map((o) =>
      '<button class="choice' + (picked === o.value ? " selected" : "") + '" ' +
      'onclick="answerOne(' + n + ',\'' + q.field + '\',\'' + o.value + '\')">' +
      esc(o.label) + (o.note ? '<span class="note">' + esc(o.note) + '</span>' : "") +
      '</button>').join("") + '</div>';
  }

  return '<div class="tablet">' + bar(c.name + " · Kiosk 04") +
    '<div class="pane">' +
      '<div class="progress"><div class="track"><span style="width:' +
        Math.round(100 * n / total) + '%"></span></div>' +
        '<span class="small">' + n + ' of ' + total + '</span></div>' +
      '<h1>' + esc(q.prompt) + '</h1>' +
      (q.helper ? '<p class="lede">' + esc(q.helper) + '</p>' : "") +
      choices +
      (q.reassurance ? '<div class="card soft"><span class="strong">' +
        esc(q.reassurance.title) + '</span><span class="small">' +
        esc(q.reassurance.body) + '</span></div>' : "") +
      (n > 1 ? '<div class="notes-always"><a class="btn quiet" ' +
        'href="#/inside/intake/' + (n - 1) + '">&larr; Back</a></div>' : "") +
      '</div></div>';
});

window.answerOne = function (n, field, value) {
  const c = subject();
  c.answers[field] = value; save();
  advance(n);
};

window.answerMulti = function (n, field) {
  const c = subject();
  const picked = Array.from(document.querySelectorAll('input[name=opt]:checked'))
    .map((i) => i.value).filter((v) => v !== "none");
  c.answers[field] = picked.length ? picked : ["none"];
  save();
  advance(n);
};

function advance(n) {
  go(n >= RULES.insideQuestions.length
    ? "#/inside/stand" : "#/inside/intake/" + (n + 1));
}

route(/^\/inside\/stand$/, () => {
  if (!guard("inside")) return "";
  const c = subject();
  const moves = (c.state === "credit_invisible" || c.state === "not_yet_triaged")
    ? [["You don't have a file yet",
        "That is not the same as bad credit. Empty moves faster than damaged does."],
       ["One account, paid on time, starts the clock",
        "Ms. Reyes will set this up with you before you go home."]]
    : [["Your file exists and two items are disputed",
        "Ms. Reyes approved the letters. The bureaus have to answer."],
       ["One account, paid on time, keeps the clock running",
        "Set up before release, not after."]];
  if ((c.answers.obligations || []).some((o) => o !== "none"))
    moves.push(["What the court ordered is tracked separately",
      "It matters, and it does not sit in this list pretending to be a credit card."]);

  const pos = (c.state === "thin_file" || c.state === "errors_present") ? 2 : 1;
  return '<div class="tablet">' + bar(c.name + " · where you stand") +
    '<div class="pane"><h1>Here\'s where you\'re starting.</h1>' +
    '<div class="row" style="gap:8px">' +
      ["Getting started", "Building", "Strong"].map((s, i) =>
        '<div style="flex:1"><div class="track"><span style="width:' +
        (i < pos ? 100 : 0) + '%"></span></div>' +
        '<div class="tiny" style="margin-top:6px">' + s + '</div></div>').join("") +
    '</div>' +
    '<p class="small">No number. No grade. A position on the road, and the ' +
      'things that move you along it.</p>' +
    '<div class="stack">' + moves.map((m, i) =>
      '<div class="event"><div class="dot">' + (i + 1) + '</div><div>' +
      '<div class="strong">' + esc(m[0]) + '</div>' +
      '<div class="small">' + esc(m[1]) + '</div></div></div>').join("") + '</div>' +
    '<a class="btn" href="#/inside/case">See what\'s happening on my case</a>' +
    '</div></div>';
});

route(/^\/inside\/case$/, () => {
  if (!guard("inside")) return "";
  const c = subject();
  const auth = liveAuth(c);
  return '<div class="tablet">' + bar(c.name + " · your case") +
    '<div class="pane"><h1>People are working on this while you wait.</h1>' +
    (c.timeline.length
      ? '<div class="timeline">' + c.timeline.map((e, i) =>
          '<div class="event' + (e.done ? "" : " pending") + '">' +
          '<div class="dot">' + (e.done ? "&check;" : (i + 1)) + '</div><div>' +
          '<div class="strong">' + esc(e.text) + '</div>' +
          '<div class="small">' + esc(e.actor) + (e.on ? " &middot; " + esc(e.on) : "") +
          '</div></div></div>').join("") + '</div>'
      : '<div class="card soft"><span class="small">Nothing has happened yet. ' +
        'Once your counselor starts, every step shows up here with the name of ' +
        'the person who did it.</span></div>') +
    (c.lesson ? '<div class="card soft"><span class="strong">Your one thing this week</span>' +
      '<span class="small">' + esc(c.lesson) + ' Ms. Reyes will ask you about it ' +
      'Thursday.</span></div>' : "") +
    '<div class="card"><span class="strong">Who is helping you</span>' +
      (auth
        ? '<span class="small">' + esc(auth.helper) + ' can receive your mail and ' +
          'add the reports. The authorization expires ' + esc(auth.expires) + '.</span>' +
          '<span class="small">They cannot open an account in your name, take out ' +
          'credit, move money, or change your address.</span>' +
          '<a class="btn ghost" href="#/inside/authorization">Review or cancel this</a>'
        : '<span class="small">Nobody outside is authorized right now. Ms. Reyes ' +
          'handles it through the program instead. A few steps run slower. ' +
          'Nothing stops.</span>' +
          '<a class="btn ghost" href="#/inside/authorization">Name someone</a>') +
    '</div>' +
    '</div></div>';
});

function liveAuth(c) {
  const a = c.authorization;
  if (!a || a.revoked) return null;
  return new Date(a.expires) > new Date() ? a : null;
}

route(/^\/inside\/authorization$/, () => {
  if (!guard("inside")) return "";
  const c = subject();
  const auth = liveAuth(c);
  const forbidden = ["Open an account", "Apply for credit", "Move money",
                     "Change the address on file",
                     "See the Social Security number",
                     "See full account numbers"];
  return '<div class="tablet">' + bar(c.name + " · Kiosk 04") +
    '<div class="pane"><h1>Who is helping you</h1>' +
    (auth
      ? '<div class="card"><span class="strong">' + esc(auth.helper) + ', since ' +
          esc(auth.signed) + '</span><span class="small">Expires ' + esc(auth.expires) +
          '. Rung 1 of the access ladder: a plain signed request.</span>' +
          '<div class="row">' + ["Receive the mail", "Add photos of the reports",
            "Mail a letter we print", "Be contacted by the counselor"].map((s) =>
            '<span class="tag">' + s + '</span>').join("") + '</div></div>' +
        '<div class="card dashed"><span class="strong">Nobody gets more than they ' +
          'need</span><span class="small">Whoever helps you cannot open an account ' +
          'in your name, take out credit, move money, or change your address.</span>' +
          forbidden.map((f) => '<span class="tiny">&times; ' + f + '</span>').join("") +
        '</div>' +
        '<button class="btn wide" onclick="revoke()">Cancel this authorization</button>' +
        '<p class="small">You can cancel from this screen without telling ' +
          esc(auth.helper) + ' first. Ms. Reyes is told the same day.</p>'
      : '<div class="card"><span class="strong">No outside helper right now</span>' +
          '<span class="small">Ms. Reyes handles it through the program instead, ' +
          'using the same form you already signed with her. A few steps run ' +
          'slower. Nothing stops.</span></div>' +
        '<label class="small" for="hn">Name someone you trust</label>' +
        '<input class="choice" id="hn" placeholder="First name" style="font-size:18px">' +
        '<button class="btn wide" onclick="nameHelper()">Send them the invitation</button>' +
        '<p class="small">Naming someone starts an invitation. It does not give ' +
          'them anything. They agree on their own screen, after they have been ' +
          'shown exactly what they would be agreeing to.</p>') +
    '<div class="notes-always">' +
      '<a class="btn quiet" href="#/inside/case">&larr; Back to my case</a>' +
    '</div></div></div>';
});

window.revoke = function () {
  const c = subject();
  if (c.authorization) c.authorization.revoked = new Date().toISOString().slice(0, 10);
  c.helper = null;
  c.timeline.push({ text: "You cancelled the authorization", actor: "You",
                    on: shortDate(), done: true });
  save(); render();
};

window.nameHelper = function () {
  const c = subject();
  const v = (document.getElementById("hn").value || "").trim().slice(0, 40);
  if (!v) return;
  c.helper = v; save();
  alert("Invitation started for " + v + ".\n\nThey sign in with the code " +
        c.helperCode + " and agree on their own screen. Nothing is granted " +
        "until they do.");
  render();
};

function shortDate() {
  return new Date().toLocaleDateString("en-US", { month: "long", day: "numeric" });
}

/* ---------- screens: family ------------------------------------------- */

route(/^\/family$/, () => {
  if (!guard("family")) return "";
  const c = subject();
  return liveAuth(c) ? (go("#/family/task"), "") : invitation(c);
});

function invitation(c) {
  const days = Math.round((new Date(c.release) - Date.now()) / 86400000);
  const home = days <= 0 ? "They are home already"
    : days < 14 ? "They come home in about " + days + " days"
    : days < 45 ? "They come home in about a month"
    : "They come home in about " + Math.round(days / 30) + " months";
  return '<div class="phone">' + bar("Invitation") + '<div class="pane">' +
    '<h1>' + esc(c.first) + ' asked you to help.</h1>' +
    '<p class="lede">' + esc(home) + '. There are things they can\'t do from ' +
      'inside, and you can.</p>' +
    '<div class="card soft"><span class="strong">What you\'d actually do</span>' +
      '<span class="small">&middot; Sign for and open the mail</span>' +
      '<span class="small">&middot; Take photos of it with your phone</span>' +
      '<span class="small">&middot; Drop some letters in a mailbox</span>' +
      '<span class="tiny">Maybe twenty minutes total, spread over three months.</span></div>' +
    '<div class="card warn"><span class="strong">What we will never ask you for</span>' +
      '<span class="small">Your Social Security number. Your bank login. Your ' +
      'card. Money. Access to your own credit.</span>' +
      '<span class="small">None of this touches your credit or your accounts. ' +
      'Not once, not ever.</span></div>' +
    '<div class="card"><span class="strong">What you would be signing</span>' +
      '<span class="small">A scoped authorization, 365 days, covering exactly ' +
      'these four things and nothing else:</span>' +
      ["Receive their mail", "Add photos of the reports",
       "Mail a dispute letter we print for you", "Be contacted by their counselor"]
        .map((s) => '<span class="tiny">&middot; ' + s + '</span>').join("") +
      '<span class="small">' + esc(c.first) + ' can cancel it from the tablet ' +
      'without telling you first.</span></div>' +
    '<label class="check"><input type="checkbox" id="k1"><span class="small">' +
      'I\'ll receive their mail and add it here</span></label>' +
    '<label class="check"><input type="checkbox" id="k2"><span class="small">' +
      'Ms. Reyes, their counselor, can contact me</span></label>' +
    '<input class="choice" id="hname" placeholder="Your first name" ' +
      'style="font-size:18px" value="' + esc(c.helper || "") + '">' +
    '<button class="btn wide" onclick="acceptHelp()">Yes, I\'ll help</button>' +
    '</div></div>';
}

window.acceptHelp = function () {
  const c = subject();
  if (!document.getElementById("k1").checked || !document.getElementById("k2").checked) {
    alert("Both boxes have to be ticked. They are what you are agreeing to.");
    return;
  }
  const name = (document.getElementById("hname").value || "").trim().slice(0, 40);
  if (!name) { alert("Your first name, so the counselor knows who to ask for."); return; }
  const now = new Date(), year = new Date(now.getTime() + 365 * 86400000);
  c.authorization = { helper: name, signed: now.toISOString().slice(0, 10),
                      expires: year.toISOString().slice(0, 10), revoked: null };
  c.helper = name;
  c.timeline.push({ text: name + " agreed to help", actor: "Your helper",

}

function tidyName(raw) {
  // Roman numerals shout, name suffixes do not: "Andre Quinones Jr. III".
  return (raw || "").split(/\s+/).filter(Boolean).map((w) => {
    const bare = w.replace(/\.$/, "").toUpperCase();
    if (/^(II|III|IV|V|VI)$/.test(bare)) return bare;
    if (/^(JR|SR)$/.test(bare)) return bare[0] + bare.slice(1).toLowerCase() + ".";
    if (w.replace(".", "").length === 1) return w.toUpperCase();
    // O'Brien and McDonald both need a second capital. Getting somebody's own
    // name wrong on their own screen is a small disrespect people notice.
    let out = w[0].toUpperCase() + w.slice(1).toLowerCase();
    const ap = out.indexOf("'");
    if (ap > 0 && ap <= 2 && out.length > ap + 1)
      out = out.slice(0, ap + 1) + out[ap + 1].toUpperCase() + out.slice(ap + 2);
    const pre = out.startsWith("Mac") ? "Mac" : out.startsWith("Mc") ? "Mc" : "";
    if (pre && out.length > pre.length + 1)
      out = pre + out[pre.length].toUpperCase() + out.slice(pre.length + 1);
    return out;
  }).join(" ");
}

window.createClient = function () {
  const get = (id) => (document.getElementById(id).value || "").trim();
  const f = { name: get("name"), din: get("din"), nysid: get("nysid"),
              facility: get("facility"), release: get("release") };
  INTAKE.form = f;

  const fail = (field, msg) => { INTAKE.field = field; INTAKE.error = msg; render(); };

  const name = tidyName(f.name);
  if (name.length < 2) return fail("name", "Enter the person's name.");
  if (!f.din && !f.nysid) return fail("din", "Enter a DIN, a NYSID, or both.");

  let din = "", nysid = "";
  if (f.din) {
    let p; try { p = parseId(f.din); } catch (e) { return fail("din", e.message); }
    if (p.kind !== "DIN") return fail("din", "That is a NYSID. Put it in the NYSID box instead.");
    din = p.key;
    if (Object.values(DB.clients).some((c) => c.din === din))
      return fail("din", p.display + " is already on the caseload.");
  }
  if (f.nysid) {
    let p; try { p = parseId(f.nysid); } catch (e) { return fail("nysid", e.message); }
    if (p.kind !== "NYSID") return fail("nysid", "That is a DIN. Put it in the DIN box instead.");
    nysid = p.key;
    if (Object.values(DB.clients).some((c) => c.nysid === nysid))
      return fail("nysid", nysid + " is already on the caseload.");
  }
  if (!f.facility) return fail("facility",
    "Name the facility. It goes on the envelope as the return address, and the " +
    "bureaus ask for it on mail from a prison.");
  if (!f.release || isNaN(new Date(f.release)))
    return fail("release", "Enter the release date.");

  const days = Math.round((new Date(f.release) - Date.now()) / 86400000);
  let id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  if (DB.clients[id]) id = id + "-" + (din || nysid).toLowerCase();

  let code;
  do { code = "BRIDGE-" + String(Math.floor(1000 + Math.random() * 9000)); }
  while (Object.values(DB.clients).some((c) => c.helperCode === code));

  DB.clients[id] = {
    id, name, first: name.split(" ")[0], din, nysid, facility: f.facility,
    release: f.release, clock: days, state: "not_yet_triaged",
    stateLabel: "Not yet triaged", needs: "No report on file",
    helper: null, helperCode: code, rung: 1, reportSummary: "", lastPulled: "",
    collections: 0, consent: ["report_sharing"],
    consentOn: new Date().toISOString().slice(0, 10), lesson: "", flagged: [],
    answers: {}, pages: [], taskDone: false, authorization: null, timeline: []
  };
  ensureAccounts();
  save();
  INTAKE = { form: {}, error: null, field: null };
  JUST_CREATED = id;
  go("#/staff/" + id);
};

window.runTriage = function (id) {
  const c = DB.clients[id];

        document.querySelectorAll('input[name=' + q.field + ']:checked'))
        .map((i) => i.value).filter((v) => v !== "none");
      a[q.field] = picked.length ? picked : ["none"];
    } else {
      const el = document.querySelector('input[name=' + q.field + ']:checked');
      a[q.field] = el ? el.value : q.options[0].value;
    }
  });
  const r = classify(a);
  c.answers = Object.assign({}, c.answers, a);
  c.classification = r;
  c.state = r.state;
  c.stateLabel = r.path.label;
  c.needs = r.jumps ? "Dispute letter to approve" : r.path.first_step;
  if (r.jumps) c.clock = Math.min(c.clock, -1);
  save(); render();
};

});

function dinDisplay(d) {
  const m = /^(\d{2})([A-Z])(\d{4})$/.exec(d || "");
  return m ? m[1] + "-" + m[2] + "-" + m[3] : (d || "");
}

/* The vendor case plan. An Offender Rehabilitation Coordinator already keeps a
   plan of goals and tasks and reviews it quarterly, so Bridge contributes to
   its financial domain rather than being a second system. The vital documents
   packet reentry staff already assemble is exactly what rung 2 of the access
   ladder asks for, which is why it is surfaced here. */
function casePlanCard(c) {
  const docs = [
    ["Social Security card", true,
     "Needed for every report request and every dispute."],
    ["Birth certificate", c.rung > 1,
     "The state can request a certified copy at no cost using sentence and " +
     "commitment paperwork."],
    ["Non-driver ID", c.rung > 2,
     "Free for people receiving public assistance, SNAP or Medicaid. This is " +
     "what clears rung 2 when a bureau cannot match the file."]
  ];
  const complete = docs.every((d) => d[1]);
  const days = Math.round((new Date(c.release) - Date.now()) / 86400000);
  const reviews = Math.max(0, Math.floor(days / 91));

  return '<div class="card accent"><h3>Offender Case Plan</h3>' +
    '<p class="tiny">Kept by the coordinator in the vendor system. Bridge ' +
      'reads it and writes back to the financial domain only.</p>' +
    '<p class="small"><span class="strong">' + reviews + ' quarterly review' +
      (reviews === 1 ? '' : 's') + '</span> left before release</p>' +
    '<h3 style="margin-top:4px">Vital documents</h3>' +
    docs.map((d) => '<div class="row">' +
      '<span class="tag ' + (d[1] ? 'green' : 'amber') + '">' +
        (d[1] ? 'On file' : 'Needed') + '</span>' +
      '<span class="small strong">' + esc(d[0]) + '</span>' +
      '<span class="tiny" style="flex-basis:100%">' + esc(d[2]) + '</span>' +
      '</div>').join("") +
    '<p class="small' + (complete ? ' strong' : '') + '">' +
      (complete
        ? 'The vital documents packet is complete, so rung 2 needs no new paperwork.'
        : 'Still needed for rung 2: ' +
          docs.filter((d) => !d[1]).map((d) => d[0]).join(", ") + '.') +
    '</p></div>';
}

function ladderRows(c) {
  const rungs = [
    ["Plain request", "Name, SSN, date of birth, address history. Signed by the client.",
     "One signature. No notary, no trip, no helper required."],
    ["Identity documents", "Copy of ID, proof of address.",
     "Sent when a bureau cannot match the file."],
    ["Limited power of attorney",
     "Notarized, scoped to credit reports and disputes, twelve months.",
     "A notary trip at the law library. Only when the helper must act alone."],
    ["Program release", "The org's own release form, signed by the client.",
     "No outside helper at all. Slower, but nothing stops."]
  ];
  return rungs.map((r, i) => {
    const n = i + 1;
    const status = n < c.rung ? "Kicked back" : n === c.rung ? "Worked" : "Not needed";
    return '<div class="rung' + (n === c.rung ? " active" : "") + '">' +
      '<span class="n">' + n + '</span><div>' +
      '<div class="small strong">' + n + ' · ' + r[0] + '</div>' +
      '<div class="tiny">' + r[1] + '</div><div class="tiny">' + r[2] + '</div>' +
      '<span class="tag' + (status === "Worked" ? " green" : "") + '">' + status +
      '</span></div></div>';
  }).join("");
}

function letterCard(id, draft, pendingCount, total) {
  return '<div class="card warn"><h3>Dispute letter awaiting your approval</h3>' +
    '<p class="small">To ' + esc(draft.bureau) + ' &middot; ' + pendingCount +
      ' of ' + total + ' letters for this item still awaiting approval</p>' +
    '<textarea class="letter" id="letterbody">' + esc(draft.body) + '</textarea>' +
    '<div class="card soft" style="margin:10px 0">' +
      draft.citations.map((c) => '<span class="tiny">&middot; ' + esc(c) + '</span>').join("") +
    '</div>' +
    '<div class="row"><button class="btn" onclick="approve(\'' + id + '\',\'' +
      draft.id + '\')">Approve and print</button></div>' +
    '<p class="tiny" style="margin-top:8px">If you change the wording before ' +
      'approving, that is recorded. The edit rate is the accuracy metric.</p></div>';
}

function planStep(c, drafts) {
  const pending = drafts.filter((d) => !d.approved).length;
  const approved = drafts.length - pending;
  if (pending) return approved + " of " + drafts.length + " letters approved. " +
    pending + " waiting on you.";
  if (approved) return "All " + approved + " letters approved. Next: the helper " +
    "mails them, then the clock runs 30 days from each bureau's receipt.";
  return c.flagged.length ? c.flagged.length + " items flagged. Dispute letters " +
    "not drafted yet." : "Nothing waiting.";
}

function reviewSummary() {
  const r = DB.review;
  if (!r.reviewed) return "No letters reviewed yet.";
  return r.edited + " of " + r.reviewed + " drafts were edited before approval (" +
    Math.round(100 * r.edited / r.reviewed) + "%).";
}

window.draftLetters = function (id) {
  const c = DB.clients[id];
  const el = document.querySelector('input[name=item]:checked');
  const item = c.flagged[el ? +el.value : 0];
  DB.drafts[id] = (DB.drafts[id] || []).concat(disputeLetters(c, item));
  save(); render();
};

window.approve = function (id, draftId) {
  const draft = (DB.drafts[id] || []).find((d) => d.id === draftId);
  const body = document.getElementById("letterbody").value;
  draft.edited = body.trim() !== draft.body.trim();
  draft.body = body;
  draft.approved = new Date().toISOString().slice(0, 10);
  DB.review.reviewed += 1;
  if (draft.edited) DB.review.edited += 1;
  const c = DB.clients[id];
  c.timeline.push({ text: "Ms. Reyes approved your dispute letter to " + draft.bureau,
                    actor: "Your counselor", on: shortDate(), done: true });
  save(); render();
};

window.escalate = function (id) {
  const c = DB.clients[id];
  // One rung, not four. With no helper, the POA rung is skipped: a power of
  // attorney with nobody to hold it is a notary trip for nothing.
  if (c.rung === 1) c.rung = 2;
  else if (c.rung === 2) c.rung = liveAuth(c) ? 3 : 4;
  else if (c.rung === 3) c.rung = 4;
  save(); render();
};

/* ---------- screens: citations and scope ------------------------------ */

route(/^\/signout$/, () => {
  signOut();
  return "";
});

route(/^\/citations$/, () => {
  return '<div class="sheet" style="padding-top:28px;max-width:880px">' +
    '<h1>What we checked, and what we didn\'t</h1>' +
    '<p class="lede" style="margin:10px 0 22px">Every legal sentence this app ' +
      'says comes from this list. Anything not on it renders as an open question ' +
      'instead of a confident sentence. Primary sources only.</p>' +
    '<div class="stack">' + RULES.facts.map((f) =>
      '<div class="card"><span class="tag green">' + esc(f.source) + '</span>' +
      '<p class="small">' + esc(f.statement) + '</p>' +
      '<p class="tiny"><a href="' + esc(f.url) + '">' + esc(f.url) + '</a> ' +
      '&middot; checked ' + esc(f.checked) + '</p></div>').join("") + '</div>' +
    '<div class="card warn" style="margin-top:20px"><h2>Still open</h2>' +
      '<p class="small">The app does not assert any of these.</p>' +
      RULES.open.map((q) => '<p class="tiny">&middot; ' + esc(q) + '</p>').join("") +
    '</div>' +
    (RULES.interviews.length ? '<div class="card soft" style="margin-top:16px">' +
      '<h2>Practitioner interview</h2>' +
      '<p class="small">Evidence, and not the same kind of evidence as a statute. ' +
      'Labelled wherever it is used.</p>' +
      RULES.interviews.map((i) => '<p class="small strong">' + esc(i.who) +
        ', ' + esc(i.when) + '</p>' +
        i.claims.map((c) => '<p class="tiny">&middot; ' + esc(c) + '</p>').join("")
      ).join("") + '</div>' : "") +
    '<div class="card soft" style="margin-top:16px"><h2>Bureau addresses</h2>' +
      '<p class="small">A dispute goes to all three. These move without ' +
      'announcement, so each carries where it came from.</p>' +
      RULES.bureaus.map((b) => '<div class="rung"><div>' +
        '<div class="small strong">' + esc(b.name) + '</div>' +
        b.address.map((l) => '<div class="tiny">' + esc(l) + '</div>').join("") +
        '<div class="tiny"><a href="' + esc(b.url) + '">source</a></div>' +
        (b.note ? '<div class="tiny" style="color:var(--rust)">' + esc(b.note) +
          '</div>' : "") + '</div></div>').join("") + '</div>' +
    '<p style="margin-top:18px"><a class="btn ghost" href="#/">Back</a></p></div>';
});

/* ---------- go -------------------------------------------------------- */

ensureAccounts();
render();
</script>
