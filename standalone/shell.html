"use strict";

/* =====================================================================
   Bridge, standalone build.

   The same product as the server app, running entirely in this file. State
   lives in localStorage, so everything a person does here stays on the device
   and nothing is sent anywhere. That is also why it can be opened from a USB
   stick, emailed, or installed to a tablet home screen with no install.

   The triage states, the letter templates, the verified facts and the bureau
   addresses are generated out of the Python modules by standalone/build.py,
   so this file cannot quietly drift from the version the test suite covers.
   ===================================================================== */

const RULES = "__BRIDGE_RULES__";

/* ---------- storage ------------------------------------------------- */

const KEY = "bridge.v1";

function blank() {
  return { accounts: {}, clients: seedClients(), session: null, drafts: {},
           review: { reviewed: 0, edited: 0 } };
}

let DB = load();

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* private window, blocked storage: fall through */ }
  return blank();
}

function save() {
  try {
    DB.savedAt = new Date().toISOString();
    localStorage.setItem(KEY, JSON.stringify(DB));
  } catch (e) { /* nothing to do; the session still works until reload */ }
}

function lastSavedText() {
  if (!DB.savedAt) return "not yet";
  const d = new Date(DB.savedAt);
  return d.toLocaleString(undefined,
    { dateStyle: "medium", timeStyle: "short" });
}

function reset() {
  DB = blank();
  save();
  location.hash = "#/";
  render();
}

/* ---------- identifiers ---------------------------------------------- */
/* Mirrors app/identifiers.py. DIN shape is confirmed from DOCCS; the NYSID
   check letter is not, so it is accepted and never validated. */

const DIN_RE = /^(\d{2})([A-Z])(\d{4})$/;
const NYSID_RE = /^(\d{8})([A-Z]?)$/;

function scrub(raw) { return (raw || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase(); }

function parseId(raw) {
  const s = scrub(raw);
  if (!s) throw new Error("Enter your DIN or your NYSID.");
  let m = DIN_RE.exec(s);
  if (m) return { kind: "DIN", key: s, display: m[1] + "-" + m[2] + "-" + m[3] };
  if (NYSID_RE.test(s)) return { kind: "NYSID", key: s, display: s };
  if (/^\d{6}$/.test(s))
    throw new Error("That looks like a DIN with the facility letter missing. " +
      "A DIN is two digits, a letter, then four digits, like 98-A-0004.");
  if (s.length < 7)
    throw new Error("That is too short. A DIN looks like 98-A-0004. A NYSID is " +
      "eight digits, sometimes with a letter on the end.");
  throw new Error("That is not a DIN or a NYSID. A DIN is two digits, a letter, " +
    "then four digits, like 98-A-0004. A NYSID is eight digits, sometimes with " +
    "a letter on the end.");
}

/* ---------- PINs ------------------------------------------------------ */
/* Hashed with PBKDF2 through WebCrypto. Even in a demo that stores everything
   in the browser, writing somebody's PIN down in the clear teaches the wrong
   habit to whoever picks this up next. */

const ROUNDS = 150000;

async function hashPin(pin, saltHex) {
  const salt = saltHex ? hexToBytes(saltHex)
                       : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt, iterations: ROUNDS, hash: "SHA-256" }, key, 256);
  return bytesToHex(salt) + "$" + bytesToHex(new Uint8Array(bits));
}

async function checkPin(pin, stored) {
  if (!stored) return false;
  const saltHex = stored.split("$")[0];
  return (await hashPin(pin, saltHex)) === stored;
}

function bytesToHex(b) {
  return Array.from(b).map((x) => x.toString(16).padStart(2, "0")).join("");
}
function hexToBytes(h) {
  const out = new Uint8Array(h.length / 2);
  for (let i = 0; i < out.length; i++) out[i] = parseInt(h.substr(i * 2, 2), 16);
  return out;
}

const MAX_ATTEMPTS = 5;
const LOCKOUT_MS = 15 * 60 * 1000;
const IDLE_MS = 15 * 60 * 1000;
const STAFF_IDLE_MS = 8 * 60 * 60 * 1000;

function pinProblem(pin, idNumber) {
  const digits = (pin || "").replace(/\D/g, "");
  if (digits.length !== 6) return "Your PIN needs to be 6 numbers.";
  if (new Set(digits).size === 1)
    return "Pick something other than the same number six times.";
  let up = true, down = true;
  for (let i = 1; i < digits.length; i++) {
    if (+digits[i] !== +digits[i - 1] + 1) up = false;
    if (+digits[i] !== +digits[i - 1] - 1) down = false;
  }
  if (up || down) return "Pick something that is not just counting up or down.";
  if (idNumber && (idNumber.replace(/\D/g, "")).includes(digits))
    return "That is part of your own number, which anyone holding your " +
           "paperwork can read. Pick something else.";
  return null;
}

/* ---------- accounts and session -------------------------------------- */

function accountFor(role, key) {
  const id = role + ":" + key;
  if (!DB.accounts[id]) return null;
  return Object.assign({ id }, DB.accounts[id]);
}

function accountsForClient(clientId) {
  return Object.keys(DB.accounts).filter(
    (k) => DB.accounts[k].role === "inside" && DB.accounts[k].subject === clientId);
}

function ensureAccounts() {
  Object.values(DB.clients).forEach((c) => {
    [["inside", c.din], ["inside", c.nysid], ["family", c.helperCode]]
      .forEach(([role, key]) => {
        const id = role + ":" + key;
        if (!DB.accounts[id])
          DB.accounts[id] = { role, subject: c.id, key,
                              pin: null, fails: 0, lockedUntil: null };
      });
  });
  if (!DB.accounts["staff:REYES"])
    DB.accounts["staff:REYES"] = { role: "staff", subject: "", key: "REYES",
                                   pin: null, fails: 0, lockedUntil: null };
  save();
}

function startSession(account) {
  DB.session = { account: account.id, role: account.role,
                 subject: account.subject, seen: Date.now() };
  save();
}

function session() {
  const s = DB.session;
  if (!s) return null;
  const limit = s.role === "staff" ? STAFF_IDLE_MS : IDLE_MS;
  if (Date.now() - s.seen > limit) { DB.session = null; save(); return null; }
  s.seen = Date.now();
  return s;
}

function signOut() { DB.session = null; save(); go("#/"); }

function subject() {
  const s = session();
  return s && s.subject ? DB.clients[s.subject] : null;
}

/* ---------- triage, mirroring app/triage.py --------------------------- */

function classify(a) {
  const reasons = [];
  let review = false;

  const obligationNotes = [];
  (a.obligations || []).forEach((o) => {
    if (o === "restitution") obligationNotes.push(
      "Restitution goes to the obligations list, not the credit path. " +
      "Different mechanism, different screen. Whether restitution is ever " +
      "furnished to a bureau is still an open question, so the app does not " +
      "claim either way.");
    if (o === "child_support") obligationNotes.push(
      "Child support arrears do reach credit reports: states are required to " +
      "report delinquencies to the bureaus periodically, after notice and a " +
      "chance to contest. Expect this one on the file. (42 U.S.C. 666(a)(7).)");
    if (o === "court_fines") obligationNotes.push(
      "Court fines are tracked as an obligation. Civil judgments largely " +
      "vanished from credit reports after July 2017, so do not assume a fine " +
      "is on the file, but whether fines are furnished at all is still open.");
  });

  const done = (key) => ({
    state: key, reasons, review, obligations: obligationNotes,
    jumps: key === "errors_present",
    path: RULES.states.find((s) => s.key === key)
  });

  if (a.report_result === "not_pulled") {
    reasons.push("No report on file yet, so there is nothing to classify.");
    if (a.ever_had_account === "unsure")
      reasons.push("Client is unsure whether they ever had an account. Common, " +
        "and not a problem. The report settles it.");
    return done("not_yet_triaged");
  }

  // Errors outrank everything: only a dispute carries a legal clock.
  if (a.recognizes_everything === "some_not_mine") {
    reasons.push("Client does not recognize at least one item on the report.");
    if (a.collections === "some" || a.collections === "many")
      reasons.push("Collections are also present. Dispute first, because it is " +
        "the only part with a deadline; debt triage follows.");
    return done("errors_present");
  }

  if (a.report_result === "no_file_found") {
    reasons.push("Bureau returned no file. Empty, not damaged.");
    if (a.ever_had_account === "yes") {
      reasons.push("Client recalls an account but the bureau found no file. " +
        "Worth a second look: a name or SSN mismatch can hide a real file.");
      review = true;
    }
    if (a.has_bank_account === "no")
      reasons.push("No bank account, so the builder loan or secured card needs " +
        "one opened first. That is the first step, not a blocker.");
    return done("credit_invisible");
  }

  if (a.collections === "some" || a.collections === "many") {
    reasons.push("Collections present on the report. Real debt, not a gap.");
    if (a.collections === "many")
      reasons.push("Volume is high enough that debt triage comes first.");
    return done("damaged_file");
  }

  if (a.collections === "unknown") {
    reasons.push("Collections status unknown on a file that exists. Counselor " +
      "reads the report before the path is set.");
    review = true;
  }
  if (a.recognizes_everything === "not_reviewed_yet") {
    reasons.push("Nobody has walked the report with the client line by line " +
      "yet, so an error finding is still possible.");
    review = true;
  }
  reasons.push(a.report_result === "thin_or_stale"
    ? "File exists but is thin or stale. Boosters before new credit."
    : "Full file, nothing in collections, nothing disputed. Boosters and " +
      "on-time signals are the remaining work.");
  return done("thin_file");
}

/* ---------- letters --------------------------------------------------- */

function today() {
  return new Date().toLocaleDateString("en-US",
    { year: "numeric", month: "long", day: "numeric" });
}

function disputeLetters(client, item) {
  return RULES.bureaus.map((b) => ({
    id: client.id + "-" + b.name + "-" + item.last4,
    bureau: b.name,
    approved: null,
    edited: null,
    citations: RULES.facts.filter((f) => /1681i|dispute/i.test(f.source + f.statement))
                 .map((f) => f.statement + " (" + f.source + ", checked " + f.checked + ")")
                 .concat(["Address from " + b.url], b.note ? [b.note] : []),
    body: RULES.disputeTemplate
      .replace("{today}", today())
      .replace("{address_block}", b.address.join("\n"))
      .replace(/\{client_name\}/g, client.name)
      .replace("{creditor}", item.creditor)
      .replace("{last_four}", item.last4)
      .replace("{reason}", item.reason)
  }));
}

function requestLetter(client) {
  const helper = client.authorization ? client.authorization.helper : "the program";
  return RULES.requestTemplate
    .replace("{today}", today())
    .replace("{address_block}", RULES.acr.address.join("\n"))
    .replace(/\{client_name\}/g, client.name)
    .replace(/\{identification\}/g, client.din)
    .replace("{id_label}", "DIN")
    .replace(/\{facility\}/g, client.facility)
    .replace("{current_address}", "  c/o " + helper + ", on file with the program");
}

/* ---------- tiny view layer ------------------------------------------- */

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

function go(hash) { location.hash = hash; }

const ROUTES = [];
function route(pattern, view) { ROUTES.push({ pattern, view }); }

function render() {
  ensureAccounts();
  const hash = location.hash.replace(/^#/, "") || "/";
  for (const r of ROUTES) {
    const m = r.pattern.exec(hash);
    if (m) {
      Promise.resolve(r.view.apply(null, m.slice(1))).then((html) => {
        document.getElementById("app").innerHTML = demoBar() + html;
        window.scrollTo(0, 0);
      });
      return;
    }
  }
  document.getElementById("app").innerHTML = demoBar() + notFound();
}

window.addEventListener("hashchange", render);

function notesOn() {
  try { return localStorage.getItem("bridge.notes") === "1"; } catch (e) { return false; }
}

window.toggleNotes = function () {
  try { localStorage.setItem("bridge.notes", notesOn() ? "0" : "1"); } catch (e) {}
  applyNotes(); render();
};

function applyNotes() {
  document.body.classList.toggle("show-notes", notesOn());
}

function demoBar() {
  const s = session();
  return '<div class="demo-bar">' +
    '<strong>Bridge</strong> <span>prototype &middot; fictional caseload</span>' +
    (s ? ' <span>&middot; signed in: ' + esc(s.role) + '</span>' : '') +
    '<span class="sp"></span>' +
    '<a href="#" onclick="toggleNotes();return false">' +
      (notesOn() ? "hide design notes" : "design notes") + '</a>' +
    '<a href="#/citations">what we checked</a>' +
    '<a href="#/scope">scope</a>' +
    (s ? '<a href="#" onclick="signOut();return false">sign out</a>' : '') +
    '<a href="#" onclick="if(confirm(\'Clear everything on this device and start over?\')){reset()}return false">start over</a>' +
    '</div>';
}

window.submitId = function (role) {
  const raw = document.getElementById("idfield").value;
  let key, display;
  if (role === "inside") {

  } else {
    key = scrub(raw).replace(/^BRIDGE/, "BRIDGE-");
    if (role === "family" && !/^BRIDGE-\d{4}$/.test(key)) key = (raw || "").trim().toUpperCase();
    display = key;
  }
  const account = accountFor(role, key);
  if (!account) {
    PENDING = { error: role === "inside"
      ? "No record here for " + display + ". Check the number, or ask your counselor to add you."
      : role === "family"
        ? "That code is not one of ours. It is printed on the letter that came in the mail."
        : "No staff account with that ID." };
    return render();
  }
  PENDING = { role, key, display, account };
  go(account.pin ? "#/pin" : "#/enroll");
};

window.doEnroll = async function () {
  const a = document.getElementById("p1").value;
  const b = document.getElementById("p2").value;
  if (a !== b) { PENDING.error = "Those two PINs are not the same. Try again."; return render(); }
  const problem = pinProblem(a, PENDING.key);
  if (problem) { PENDING.error = problem; return render(); }

  const hashed = await hashPin(a);
  // A client signs in with either number, so both of their accounts take the
  // same PIN. Otherwise enrolling with a DIN would ask them to enrol again
  // when they typed their NYSID.
  const ids = PENDING.role === "inside"
    ? accountsForClient(PENDING.account.subject) : [PENDING.account.id];
  ids.forEach((id) => {
    DB.accounts[id].pin = hashed;
    DB.accounts[id].fails = 0;
    DB.accounts[id].lockedUntil = null;
  });
  save();
  startSession(accountFor(PENDING.role, PENDING.key));
  const role = PENDING.role; PENDING = null;
  go("#/" + role);
};

route(/^\/pin$/, () => {
  if (!PENDING) return notFound();
  const err = PENDING.error ? denied(PENDING.error) : "";
  PENDING.error = null;
  return '<div class="tablet"><div class="pane">' +

      'style="letter-spacing:.5em;font-size:26px" ' +
      'onkeydown="if(event.key===\'Enter\')doSignIn()">' +
    '<button class="btn wide" onclick="doSignIn()">Sign in</button>' +
    '<div class="notes"><p class="tiny">Forgot it? Your counselor can clear it, ' +
      'then you pick a new one here. Nobody can tell you what your old one was.</p>' +
      '<p class="tiny"><a href="#/signin">Use a different number</a></p></div>' +
    '</div></div>';
});

window.doSignIn = async function () {
  const pin = document.getElementById("pinfield").value;
  const acct = DB.accounts[PENDING.account.id];

  if (acct.lockedUntil && Date.now() < acct.lockedUntil) {
    const mins = Math.max(1, Math.ceil((acct.lockedUntil - Date.now()) / 60000));
    PENDING.error = "Too many wrong tries. Try again in about " + mins +
      " minutes, or ask your counselor to reset it.";
    return render();
  }

  if (await checkPin(pin, acct.pin)) {
    acct.fails = 0; acct.lockedUntil = null; save();
    startSession(Object.assign({ id: PENDING.account.id }, acct));
    const role = PENDING.role; PENDING = null;
    return go("#/" + role);
  }

  acct.fails = (acct.fails || 0) + 1;
  if (acct.fails >= MAX_ATTEMPTS) {
    acct.lockedUntil = Date.now() + LOCKOUT_MS;
    acct.fails = 0;
    PENDING.error = "That PIN was wrong too many times. The account is locked " +
      "for 15 minutes. Your counselor can reset it sooner.";
  } else {
    PENDING.error = "That PIN is not right. " + (MAX_ATTEMPTS - acct.fails) +
      " tries left before it locks.";
  }
  save();
  render();
};

function field(id, label, value, placeholder, hint, bad, mono, type) {

    '<span class="hint">' + esc(hint) + '</span></div>';
}

function tidyName(raw) {
  // Roman numerals shout, name suffixes do not: "Andre Quinones Jr. III".
  return (raw || "").split(/\s+/).filter(Boolean).map((w) => {
    const bare = w.replace(/\.$/, "").toUpperCase();
    if (/^(II|III|IV|V|VI)$/.test(bare)) return bare;
    if (/^(JR|SR)$/.test(bare)) return bare[0] + bare.slice(1).toLowerCase() + ".";
    if (w.replace(".", "").length === 1) return w.toUpperCase();
    // O'Brien and McDonald both need a second capital. Getting somebody's own
    // name wrong on their own screen is a small disrespect people notice.
    let out = w[0].toUpperCase() + w.slice(1).toLowerCase();
    const ap = out.indexOf("'");
    if (ap > 0 && ap <= 2 && out.length > ap + 1)
      out = out.slice(0, ap + 1) + out[ap + 1].toUpperCase() + out.slice(ap + 2);
    const pre = out.startsWith("Mac") ? "Mac" : out.startsWith("Mc") ? "Mc" : "";
    if (pre && out.length > pre.length + 1)
      out = pre + out[pre.length].toUpperCase() + out.slice(pre.length + 1);
    return out;
  }).join(" ");
}

window.createClient = function () {
  const get = (id) => (document.getElementById(id).value || "").trim();
  const f = { name: get("name"), din: get("din"), nysid: get("nysid"),
              facility: get("facility"), release: get("release") };
  INTAKE.form = f;

  const fail = (field, msg) => { INTAKE.field = field; INTAKE.error = msg; render(); };

  const name = tidyName(f.name);
  if (name.length < 2) return fail("name", "Enter the person's name.");
  if (!f.din && !f.nysid) return fail("din", "Enter a DIN, a NYSID, or both.");

  let din = "", nysid = "";
  if (f.din) {
    let p; try { p = parseId(f.din); } catch (e) { return fail("din", e.message); }
    if (p.kind !== "DIN") return fail("din", "That is a NYSID. Put it in the NYSID box instead.");
    din = p.key;
    if (Object.values(DB.clients).some((c) => c.din === din))
      return fail("din", p.display + " is already on the caseload.");
  }
  if (f.nysid) {
    let p; try { p = parseId(f.nysid); } catch (e) { return fail("nysid", e.message); }
    if (p.kind !== "NYSID") return fail("nysid", "That is a DIN. Put it in the DIN box instead.");
    nysid = p.key;
    if (Object.values(DB.clients).some((c) => c.nysid === nysid))
      return fail("nysid", nysid + " is already on the caseload.");
  }
  if (!f.facility) return fail("facility",
    "Name the facility. It goes on the envelope as the return address, and the " +
    "bureaus ask for it on mail from a prison.");
  if (!f.release || isNaN(new Date(f.release)))
    return fail("release", "Enter the release date.");

  const days = Math.round((new Date(f.release) - Date.now()) / 86400000);
  let id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  if (DB.clients[id]) id = id + "-" + (din || nysid).toLowerCase();

  let code;
  do { code = "BRIDGE-" + String(Math.floor(1000 + Math.random() * 9000)); }
  while (Object.values(DB.clients).some((c) => c.helperCode === code));

  DB.clients[id] = {
    id, name, first: name.split(" ")[0], din, nysid, facility: f.facility,
    release: f.release, clock: days, state: "not_yet_triaged",
    stateLabel: "Not yet triaged", needs: "No report on file",
    helper: null, helperCode: code, rung: 1, reportSummary: "", lastPulled: "",
    collections: 0, consent: ["report_sharing"],
    consentOn: new Date().toISOString().slice(0, 10), lesson: "", flagged: [],
    answers: {}, pages: [], taskDone: false, authorization: null, timeline: []
  };
  ensureAccounts();
  save();
  INTAKE = { form: {}, error: null, field: null };
  JUST_CREATED = id;
  go("#/staff/" + id);
};

function dinDisplay(d) {
  const m = /^(\d{2})([A-Z])(\d{4})$/.exec(d || "");
  return m ? m[1] + "-" + m[2] + "-" + m[3] : (d || "");
}

function ladderRows(c) {
  const rungs = [
    ["Plain request", "Name, SSN, date of birth, address history. Signed by the client.",
     "One signature. No notary, no trip, no helper required."],
    ["Identity documents", "Copy of ID, proof of address.",
     "Sent when a bureau cannot match the file."],
    ["Limited power of attorney",
     "Notarized, scoped to credit reports and disputes, twelve months.",
     "A notary trip at the law library. Only when the helper must act alone."],
    ["Program release", "The org's own release form, signed by the client.",
     "No outside helper at all. Slower, but nothing stops."]
  ];
  return rungs.map((r, i) => {
    const n = i + 1;
    const status = n < c.rung ? "Kicked back" : n === c.rung ? "Worked" : "Not needed";
    return '<div class="rung' + (n === c.rung ? " active" : "") + '">' +
      '<span class="n">' + n + '</span><div>' +
      '<div class="small strong">' + n + ' · ' + r[0] + '</div>' +
      '<div class="tiny">' + r[1] + '</div><div class="tiny">' + r[2] + '</div>' +
      '<span class="tag' + (status === "Worked" ? " green" : "") + '">' + status +
      '</span></div></div>';
  }).join("");
}

function letterCard(id, draft, pendingCount, total) {
  return '<div class="card warn"><h3>Dispute letter awaiting your approval</h3>' +
    '<p class="small">To ' + esc(draft.bureau) + ' &middot; ' + pendingCount +
      ' of ' + total + ' letters for this item still awaiting approval</p>' +
    '<textarea class="letter" id="letterbody">' + esc(draft.body) + '</textarea>' +
    '<div class="card soft" style="margin:10px 0">' +
      draft.citations.map((c) => '<span class="tiny">&middot; ' + esc(c) + '</span>').join("") +
    '</div>' +
    '<div class="row"><button class="btn" onclick="approve(\'' + id + '\',\'' +
      draft.id + '\')">Approve and print</button></div>' +
    '<p class="tiny" style="margin-top:8px">If you change the wording before ' +
      'approving, that is recorded. The edit rate is the accuracy metric.</p></div>';
}

function planStep(c, drafts) {
  const pending = drafts.filter((d) => !d.approved).length;
  const approved = drafts.length - pending;
  if (pending) return approved + " of " + drafts.length + " letters approved. " +
    pending + " waiting on you.";
  if (approved) return "All " + approved + " letters approved. Next: the helper " +
    "mails them, then the clock runs 30 days from each bureau's receipt.";
  return c.flagged.length ? c.flagged.length + " items flagged. Dispute letters " +
    "not drafted yet." : "Nothing waiting.";
}

function reviewSummary() {
  const r = DB.review;
  if (!r.reviewed) return "No letters reviewed yet.";
  return r.edited + " of " + r.reviewed + " drafts were edited before approval (" +
    Math.round(100 * r.edited / r.reviewed) + "%).";
}

window.draftLetters = function (id) {
  const c = DB.clients[id];
  const el = document.querySelector('input[name=item]:checked');
  const item = c.flagged[el ? +el.value : 0];
  DB.drafts[id] = (DB.drafts[id] || []).concat(disputeLetters(c, item));
  save(); render();
};

window.approve = function (id, draftId) {
  const draft = (DB.drafts[id] || []).find((d) => d.id === draftId);
  const body = document.getElementById("letterbody").value;
  draft.edited = body.trim() !== draft.body.trim();
  draft.body = body;
  draft.approved = new Date().toISOString().slice(0, 10);
  DB.review.reviewed += 1;
  if (draft.edited) DB.review.edited += 1;
  const c = DB.clients[id];
  c.timeline.push({ text: "Ms. Reyes approved your dispute letter to " + draft.bureau,
                    actor: "Your counselor", on: shortDate(), done: true });
  save(); render();
};

window.escalate = function (id) {
  const c = DB.clients[id];
  // One rung, not four. With no helper, the POA rung is skipped: a power of
  // attorney with nobody to hold it is a notary trip for nothing.
  if (c.rung === 1) c.rung = 2;
  else if (c.rung === 2) c.rung = liveAuth(c) ? 3 : 4;
  else if (c.rung === 3) c.rung = 4;
  save(); render();
};

/* ---------- screens: citations and scope ------------------------------ */

route(/^\/citations$/, () => {

    '<div class="stack">' + RULES.facts.map((f) =>
      '<div class="card"><span class="tag green">' + esc(f.source) + '</span>' +
      '<p class="small">' + esc(f.statement) + '</p>' +
      '<p class="tiny"><a href="' + esc(f.url) + '">' + esc(f.url) + '</a> ' +
      '&middot; checked ' + esc(f.checked) + '</p></div>').join("") + '</div>' +
    '<div class="card warn" style="margin-top:20px"><h2>Still open</h2>' +

      RULES.open.map((q) => '<p class="tiny">&middot; ' + esc(q) + '</p>').join("") +
    '</div>' +
    (RULES.interviews.length ? '<div class="card soft" style="margin-top:16px">' +
      '<h2>Practitioner interview</h2>' +

      'Labelled wherever it is used.</p>' +
      RULES.interviews.map((i) => '<p class="small strong">' + esc(i.who) +
        ', ' + esc(i.when) + '</p>' +

      ).join("") + '</div>' : "") +
    '<div class="card soft" style="margin-top:16px"><h2>Bureau addresses</h2>' +
      '<p class="small">A dispute goes to all three. These move without ' +
      'announcement, so each carries where it came from.</p>' +
      RULES.bureaus.map((b) => '<div class="rung"><div>' +
        '<div class="small strong">' + esc(b.name) + '</div>' +
        b.address.map((l) => '<div class="tiny">' + esc(l) + '</div>').join("") +
        '<div class="tiny"><a href="' + esc(b.url) + '">source</a></div>' +
        (b.note ? '<div class="tiny" style="color:var(--rust)">' + esc(b.note) +
          '</div>' : "") + '</div></div>').join("") + '</div>' +
    '<p style="margin-top:18px"><a class="btn ghost" href="#/">Back</a></p></div>';
});

route(/^\/scope$/, () => {
  return '<div class="sheet" style="padding-top:28px;max-width:880px">' +
    '<h1>Three roles, three surfaces</h1>' +
    '<p class="lede" style="margin:10px 0 20px">Who can do what is set by physics ' +
      'and law, not by preference. That is what splits the app.</p>' +
    '<div class="grid three">' +
      scopeCard("Inside", "Facility tablet",
        ["Answer the intake questions", "See where the case stands",
         "See the case timeline", "Name someone to help",
         "Cancel a helper's authorization"],
        ["Verify identity online", "Receive mail", "Upload a file",
         "Mail a letter", "Read the full credit report"],
        "Offline-first in the real product. Metered by the minute. One question per screen.") +
      scopeCard("Family or friend", "Phone",
        ["Receive mail", "Photograph the reports", "Print and mail letters",
         "Take a call from the counselor"],
        ["Act without a signed, scoped authorization", "See the caseload",
         "Read or judge the report", "Approve a letter"],
        "One task on screen at a time. Long silences between tasks, by design.") +
      scopeCard("Caseworker", "Desktop",
        ["Run a triage session", "Read the report", "Approve letters",
         "Hold the deadline", "Manage a full caseload"],
        ["See more of the file than consent covers", "Choose a client's PIN"],
        "Work queue sorted by what expires first. Never a roster.") +
    '</div>' +
    '<div class="grid two" style="margin-top:20px;align-items:start">' +
    '<div class="card"><h2>What is assumed away</h2>' +
      '<p class="small">Facility and DOC approval, incumbent tablet vendor access, ' +
      'bureau data agreements, funding for the counselor role, and the PII ' +
      'compliance regime a real deployment would sit under. Signed off for class, ' +
      'and said on a slide rather than hoped past.</p>' +
      '<h2 style="margin-top:10px">What is not</h2>' +

function scopeCard(title, device, can, cannot, rule) {
  return '<div class="card"><h2>' + esc(title) + '</h2>' +
    '<span class="tag">' + esc(device) + '</span>' +
    '<p class="small strong">Can</p>' +
    can.map((c) => '<p class="tiny">&middot; ' + esc(c) + '</p>').join("") +
    '<p class="small strong">Cannot</p>' +
    cannot.map((c) => '<p class="tiny">&times; ' + esc(c) + '</p>').join("") +
    '<p class="tiny" style="color:var(--rust)">' + esc(rule) + '</p></div>';
}

ensureAccounts();
