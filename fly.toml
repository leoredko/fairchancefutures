# fly.toml — deploy with:  fly launch --copy-config --no-deploy  then  fly deploy
# Change `app` to a name nobody has taken.
app = "bridge-fcf"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  BRIDGE_DATA = "/data/bridge.json"

# The JSON store is a file, so it needs a volume to survive a deploy.
# Create it once:  fly volumes create bridge_data --size 1 --region ewr
[[mounts]]
  source = "bridge_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine. This is a demo, not a service, and a second machine with its
  # own volume would silently serve a different caseload.
  min_machines_running = 0

  [http_service.http_options.response.headers]
    # The app has no auth. Keep it out of search results at least.
    X-Robots-Tag = "noindex, nofollow"

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  timeout = "3s"
  path = "/healthz"
